# The backend image built from this checkout, on the db of docker-compose.yml (the image set in megoocolab.toml).
services:
  backend:
    build: ../../backend
    image: ${BACKEND_IMAGE}
    environment:
      DATABASE_URL: postgresql+asyncpg://megooitadmin_api:megooitadminapi@db:5432/${DB_NAME}
      DATABASE_OWNER_URL: postgresql+asyncpg://megooitadmin:megooitadmin@db:5432/${DB_NAME}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT}:8000"
    healthcheck:
      # The image has no curl.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 60
