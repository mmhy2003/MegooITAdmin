# Valkey for backend pytest (the test set in megoocolab.toml), on 127.0.0.1:${VALKEY_PORT}. No password, as in the stack.
services:
  valkey:
    image: valkey/valkey:9
    ports:
      - "127.0.0.1:${VALKEY_PORT}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 60
