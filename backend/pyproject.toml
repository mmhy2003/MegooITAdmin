[project]
name = "megooitadmin-backend"
version = "0.1.0"
description = "MegooITAdmin backend API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "asyncssh>=2.24.1",
    "cryptography>=50.0.2",
    "fastapi>=0.165.0",
    "pydantic-settings>=2.16.3",
    "pyotp>=2.12.1",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
    "valkey>=6.2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pyyaml>=6.0.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# The app is not installed as a package, so tests import it from here.
pythonpath = ["."]
markers = [
    "docker: checks the built backend image; run with megoocolab-runner services run image -- uv run pytest -m docker",
    "stack: checks the whole Compose stack through Caddy; run with megoocolab-runner services run stack -- uv run pytest -m stack",
]
addopts = "-m 'not docker and not stack'"
