# MegooITAdmin's stack. Start and stop it with the Makefile (make up, make down; see README.md).
# Only caddy publishes a port: an upstream TLS proxy sends plain HTTP to it.
# A server pulls the release images; docker-compose.build.yml builds them from the checkout for the dev and e2e stacks.
name: megooitadmin

x-healthcheck-timing: &healthcheck-timing
  interval: 5s
  timeout: 5s
  retries: 5
  start_period: 120s

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${MEGOOITADMIN_HTTP_PORT:-80}:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    # Caddy asks for no certificate (auto_https off), so it has nothing to keep.
    tmpfs:
      - /data
      - /config
    networks: [edge]
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      <<: *healthcheck-timing

  frontend:
    image: ghcr.io/mmhy2003/megooitadmin-frontend:${MEGOOITADMIN_VERSION:-latest}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    networks: [edge]
    healthcheck:
      # The image has no curl. fetch follows the redirect to /login, which renders even without the backend.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      <<: *healthcheck-timing

  backend:
    image: ghcr.io/mmhy2003/megooitadmin-backend:${MEGOOITADMIN_VERSION:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://megooitadmin_api:${POSTGRES_API_PASSWORD:?POSTGRES_API_PASSWORD is not set. Run make up or see .env.example}@db:5432/megooitadmin
      DATABASE_OWNER_URL: postgresql+asyncpg://megooitadmin:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set. Run make up or see .env.example}@db:5432/megooitadmin
      # The entrypoint gives the collector's role this password, then unsets it before the server starts.
      DATABASE_COLLECTOR_URL: postgresql+asyncpg://megooitadmin_collector:${POSTGRES_COLLECTOR_PASSWORD:?POSTGRES_COLLECTOR_PASSWORD is not set. Run make up or see .env.example}@db:5432/megooitadmin
      # The same for the logs worker's role.
      DATABASE_LOGS_URL: postgresql+asyncpg://megooitadmin_logs:${POSTGRES_LOGS_PASSWORD:?POSTGRES_LOGS_PASSWORD is not set. Run make up or see .env.example}@db:5432/megooitadmin
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?AUTH_SECRET_KEY is not set. Run make up or see .env.example}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-60}
      SESSION_ABSOLUTE_MINUTES: ${SESSION_ABSOLUTE_MINUTES:-720}
      API_DOCS: ${API_DOCS:-false}
      WEBHOOK_ALLOW_HTTP: ${WEBHOOK_ALLOW_HTTP:-false}
      LOG_STREAM_IDLE_MINUTES: ${LOG_STREAM_IDLE_MINUTES:-30}
      VALKEY_URL: valkey://valkey:6379/0
    volumes:
      # The platform's SSH private key. Back it up: a lost key means a new one on every server.
      - ssh_key:/var/lib/megooitadmin/ssh
    networks: [edge, core, servers]
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      # The image has no curl.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      <<: *healthcheck-timing

  collector:
    # The backend's image with another command: one SSH stream per server, each sample published on Valkey and
    # written to metrics. Run one collector: a second one would publish every sample twice.
    image: ghcr.io/mmhy2003/megooitadmin-backend:${MEGOOITADMIN_VERSION:-latest}
    restart: unless-stopped
    entrypoint: ["python", "-m", "app.collector"]
    environment:
      DATABASE_URL: postgresql+asyncpg://megooitadmin_collector:${POSTGRES_COLLECTOR_PASSWORD:?POSTGRES_COLLECTOR_PASSWORD is not set. Run make up or see .env.example}@db:5432/megooitadmin
      VALKEY_URL: valkey://valkey:6379/0
    volumes:
      # The platform's SSH key, read-only: the backend makes it.
      - ssh_key:/var/lib/megooitadmin/ssh:ro
    networks: [core, servers]
    depends_on:
      # A healthy backend has run the migrations and set this role's password.
      backend:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      # Passes while the collector read the servers within the last 30 seconds.
      test: ["CMD", "python", "-m", "app.collector.health"]
      <<: *healthcheck-timing

  logs:
    # The backend's image with another command: one SSH channel per log source, shared by every viewer through
    # Valkey. Run one logs worker: a second one would open every source twice.
    image: ghcr.io/mmhy2003/megooitadmin-backend:${MEGOOITADMIN_VERSION:-latest}
    restart: unless-stopped
    entrypoint: ["python", "-m", "app.logs.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://megooitadmin_logs:${POSTGRES_LOGS_PASSWORD:?POSTGRES_LOGS_PASSWORD is not set. Run make up or see .env.example}@db:5432/megooitadmin
      VALKEY_URL: valkey://valkey:6379/0
      LOG_STREAM_MAX_LINES_PER_SECOND: ${LOG_STREAM_MAX_LINES_PER_SECOND:-2000}
    volumes:
      # The platform's SSH key, read-only: the backend makes it.
      - ssh_key:/var/lib/megooitadmin/ssh:ro
    networks: [core, servers]
    depends_on:
      # A healthy backend has run the migrations and set this role's password.
      backend:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      # Passes while the worker's hub beat within the last 30 seconds.
      test: ["CMD", "python", "-m", "app.logs.worker.health"]
      <<: *healthcheck-timing

  db:
    image: timescale/timescaledb-ha:pg18
    restart: unless-stopped
    environment:
      # The image's superuser owns the tables and runs the migrations. The backend serves as megooitadmin_api
      # (migration 0003).
      POSTGRES_USER: megooitadmin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set. Run make up or see .env.example}
      POSTGRES_DB: megooitadmin
    volumes:
      # The image runs as postgres and keeps its data under /home/postgres/pgdata, not /var/lib/postgresql/data.
      - db_data:/home/postgres/pgdata
    networks: [core, exec]
    healthcheck:
      # TCP, not the socket: on first start the image's temporary server listens only on its socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U megooitadmin -d megooitadmin"]
      <<: *healthcheck-timing

  valkey:
    image: valkey/valkey:9
    restart: unless-stopped
    # Append-only file in /data, so the job queue finds it ready. No password: valkey is only on core (internal) and
    # publishes no port, and the image turns protected mode off.
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey_data:/data
    networks: [core]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      <<: *healthcheck-timing

networks:
  # edge and servers have a route out: caddy publishes a port, and the backend reaches managed servers.
  edge: {}
  core:
    internal: true
  servers: {}
  exec:
    internal: true
  sandbox:
    internal: true

volumes:
  db_data: {}
  ssh_key: {}
  valkey_data: {}
