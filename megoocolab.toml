[services.test]
description = "PostgreSQL with TimescaleDB and pgvector for backend pytest"
compose = ["tools/test-services/docker-compose.yml"]
ports = ["DB_PORT"]

[services.test.env]
DB_NAME = "megooitadmin_test"
TEST_DATABASE_URL = "postgresql+asyncpg://megooitadmin_api:megooitadminapi@localhost:${DB_PORT}/megooitadmin_test"
TEST_DATABASE_OWNER_URL = "postgresql+asyncpg://megooitadmin:megooitadmin@localhost:${DB_PORT}/megooitadmin_test"

[services.migrate]
description = "The empty scratch database megooitadmin_migrate, for generating and trying migrations"
compose = ["tools/test-services/docker-compose.yml"]
ports = ["DB_PORT"]

[services.migrate.env]
DB_NAME = "megooitadmin_migrate"
DATABASE_URL = "postgresql+asyncpg://megooitadmin_api:megooitadminapi@localhost:${DB_PORT}/megooitadmin_migrate"
DATABASE_OWNER_URL = "postgresql+asyncpg://megooitadmin:megooitadmin@localhost:${DB_PORT}/megooitadmin_migrate"

[services.image]
description = "The backend image built from this checkout, started with its own database, for pytest -m docker"
compose = ["tools/test-services/docker-compose.yml", "tools/test-services/docker-compose.image.yml"]
ports = ["DB_PORT", "API_PORT"]

[services.image.env]
DB_NAME = "megooitadmin"
BACKEND_IMAGE = "megooitadmin-backend:${MEGOO_SERVICES_PROJECT}"
BACKEND_NETWORK = "${MEGOO_SERVICES_PROJECT}_default"
BACKEND_URL = "http://localhost:${API_PORT}"
IMAGE_DATABASE_URL = "postgresql+asyncpg://megooitadmin:megooitadmin@localhost:${DB_PORT}/megooitadmin"

[services.web]
description = "The frontend image built from this checkout, for npm run test:image"
compose = ["tools/test-services/docker-compose.web.yml"]
ports = ["WEB_PORT"]

[services.web.env]
FRONTEND_IMAGE = "megooitadmin-frontend:${MEGOO_SERVICES_PROJECT}"
FRONTEND_URL = "http://localhost:${WEB_PORT}"

[services.stack]
description = "The whole Compose stack built from this checkout (caddy, frontend, backend, db), for pytest -m stack"
compose = ["docker-compose.yml"]
ports = ["STACK_PORT"]

[services.stack.env]
MEGOOITADMIN_HTTP_PORT = "127.0.0.1:${STACK_PORT}"
POSTGRES_PASSWORD = "megooitadmin"
STACK_URL = "http://localhost:${STACK_PORT}"
